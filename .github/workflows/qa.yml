name: CCL V3 QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check neural-audio.js
          node --check simple-ui.js
      - name: Dialogue bank invariants
        run: |
          python3 - <<'PY'
          import json,re
          d=json.load(open('data/dialogues.json'))
          s=json.load(open('data/site_summary.json'))
          r=json.load(open('data/audio_remote.json'))
          assert len(d)==100
          assert sum(len(x['segments']) for x in d)==1412
          assert all(12<=len(x['segments'])<=16 for x in d)
          assert max(seg['wc'] for x in d for seg in x['segments'])<=35
          assert s['dialogues']==100 and s['mock_tests']==50 and s['segments']==1412
          assert s['maxExactRepeat']<=4
          assert r['provider']=='supabase' and r['mode']=='segments' and r['version']=='v3-neural'
          banned=re.compile(r'remember the term|key expression|safest next step',re.I)
          assert not any(banned.search(seg['en']) for x in d for seg in x['segments'])
          print('CCL V3 QA passed')
          PY

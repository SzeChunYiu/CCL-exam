name: Recover v2 static payload

on:
  push:
    branches: [v2-recovery-run]
    paths:
      - 'src/v2/**'
      - '.github/workflows/recover-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Decode payload
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,gzip,hashlib
          root=Path('.')
          parts=sorted((root/'src/v2').glob('static.part*'))
          enc=''.join(p.read_text().strip() for p in parts)
          raw=gzip.decompress(base64.b64decode(enc))
          out=root/'src/v2/recovered_payload.bin'
          out.write_bytes(raw)
          print('decoded bytes',len(raw),'sha256',hashlib.sha256(raw).hexdigest())
          print('prefix',repr(raw[:160]))
          PY
          file src/v2/recovered_payload.bin || true
      - name: Commit decoded payload
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/v2/recovered_payload.bin
          if git diff --cached --quiet; then
            echo 'No recovered changes'
          else
            git commit -m 'Decode final v2 static payload [skip ci]'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

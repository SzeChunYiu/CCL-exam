name: Enable Supabase audio support

on:
  push:
    branches: [supabase-audio-storage]
    paths:
      - 'scripts/patch_supabase_audio.py'
      - '.github/workflows/enable-supabase-audio.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 scripts/patch_supabase_audio.py
      - run: node --check app.js
      - name: Commit Supabase-aware app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          if git diff --cached --quiet; then
            echo "app.js already Supabase-aware"
          else
            git commit -m "Prefer Supabase audio with local fallback [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

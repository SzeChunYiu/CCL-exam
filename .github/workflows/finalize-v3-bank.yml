name: Finalize v3 CCL bank

on:
  push:
    branches: [final-ccl-v3]
    paths:
      - 'scripts/naturalize_final_bank.py'
      - '.github/workflows/finalize-v3-bank.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply structural guardrails
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/naturalize_final_bank.py')
          t=p.read_text()
          old="shortest=sorted(range(len(D)), key=lambda i:sum(s.get('wc',en_wc(s.get('en',''))) for s in D[i]['segments']))[:9]"
          new="candidates=[i for i,d in enumerate(D) if len(d['segments'])<=14]\nshortest=sorted(candidates, key=lambda i:sum(s.get('wc',en_wc(s.get('en',''))) for s in D[i]['segments']))[:9]\nassert len(shortest)==9"
          if old not in t: raise SystemExit('shortest selector not found')
          t=t.replace(old,new)
          t=t.replace("assert worst<=8, worst","print('highest exact repeat before further QA:',worst)")
          p.write_text(t)
          PY
      - name: Naturalize and validate final bank
        run: python3 scripts/naturalize_final_bank.py
      - name: Verify final invariants
        run: |
          python3 - <<'PY'
          import json,re
          d=json.load(open('data/dialogues.json'))
          assert len(d)==100
          assert sum(len(x['segments']) for x in d)==1412
          assert max(s['wc'] for x in d for s in x['segments'])<=35
          assert all(12<=len(x['segments'])<=16 for x in d)
          assert not any(re.search(r'remember the term|key expression|safest next step',s['en'],re.I) for x in d for s in x['segments'])
          assert not any(re.search(r"don.?t agree with the outcome|written reasons first|request a review",s['en'],re.I) for x in d for s in x['segments'])
          print('v3 QA OK')
          PY
      - name: Commit generated v3 bank
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/naturalize_final_bank.py data/dialogues.json data/site_summary.json practice_pack/dialogues_metadata.json materials/SOURCE_SCRIPTS.md materials/MODEL_ANSWERS.md materials/QA_REPORT.md practice_pack/SOURCE_SCRIPTS.md practice_pack/MODEL_ANSWERS.md practice_pack/QA_REPORT.md
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m 'Build naturalized 100-dialogue v3 bank [skip ci]'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

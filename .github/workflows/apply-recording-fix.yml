name: Apply recording lifecycle fix

on:
  push:
    branches: [ccl-practice-pack]
    paths:
      - 'scripts/fix_recording_race.py'
      - '.github/workflows/apply-recording-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply guarded recording fix
        run: python3 scripts/fix_recording_race.py
      - name: Syntax check
        run: node --check app.js
      - name: Commit fixed app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          if git diff --cached --quiet; then
            echo "app.js already fixed"
          else
            git commit -m "Fix recording lifecycle race [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

name: Native Cantonese 500 Bank Final Gate

on:
  push:
    branches: [cantonese-script-audio-v4-integration]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  final-bank-gate:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Python syntax
        run: |
          python3 -m py_compile scripts/build_native_500_v10.py
          python3 -m py_compile scripts/build_native_500_v11.py
          python3 -m py_compile scripts/build_native_500_final2.py
          python3 -m py_compile scripts/build_native_500_final3.py
          python3 -m py_compile scripts/build_native_500_final4.py
          python3 -m py_compile scripts/build_native_500_final5.py
          python3 -m py_compile scripts/export_final_materials.py
          python3 -m py_compile scripts/qa_cantonese.py
          python3 -m py_compile scripts/verify_rewrite.py
          python3 -m py_compile scripts/verify_final_bank.py
          python3 -m py_compile scripts/verify_final3_bank.py
          python3 -m py_compile scripts/verify_final4_bank.py
          python3 -m py_compile scripts/audit_native_cantonese_v2.py
          python3 -m py_compile scripts/audit_cantonese_lexical_transfer.py

      - name: Build final5 500-dialogue candidate
        id: build
        continue-on-error: true
        run: |
          mkdir -p build/diagnostics
          python3 scripts/build_native_500_final5.py > build/diagnostics/final5-build.log 2>&1
          cat build/diagnostics/final5-build.log

      - name: Final structural verification
        id: verify
        continue-on-error: true
        run: |
          python3 scripts/verify_final4_bank.py data/dialogues.json --json > build/diagnostics/final5-verify.json
          cat build/diagnostics/final5-verify.json

      - name: Native template-distance gate
        id: native
        continue-on-error: true
        run: |
          python3 scripts/audit_native_cantonese_v2.py data/dialogues.json --json > build/diagnostics/final5-native.json
          cat build/diagnostics/final5-native.json

      - name: Cantonese-only lexical-transfer gate
        id: lexical
        continue-on-error: true
        run: |
          python3 scripts/audit_cantonese_lexical_transfer.py data/dialogues.json --json > build/diagnostics/final5-lexical.json
          cat build/diagnostics/final5-lexical.json

      - name: Corpus-calibrated Cantonese hard gate
        id: corpus
        continue-on-error: true
        run: |
          python3 scripts/qa_cantonese.py data/dialogues.json --json > build/diagnostics/final5-corpus.json
          cat build/diagnostics/final5-corpus.json

      - name: Export study materials from final JSON
        id: export
        continue-on-error: true
        run: |
          python3 scripts/export_final_materials.py > build/diagnostics/final5-export.json
          cat build/diagnostics/final5-export.json

      - name: Add final5 repetition hotspot report
        if: always()
        run: |
          python3 - <<'PY' > build/diagnostics/final5-hotspots.txt
          import json,re
          from collections import Counter
          data=json.load(open('data/dialogues.json'))
          H=re.compile(r'[㐀-鿿]')
          grams=Counter()
          for d in data:
            for s in d['segments']:
              if s.get('source_lang')!='yue': continue
              h=''.join(H.findall(s['source']))
              grams.update(h[i:i+10] for i in range(max(0,len(h)-9)))
          print('TOP_REPEATED_10GRAMS')
          for g,n in grams.most_common(160):
            if n>1: print(n,g)
          PY
          cat build/diagnostics/final5-hotspots.txt

      - name: Persist final5 diagnostic evidence
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build/diagnostics/final5-*
          git commit -m 'Record final5 native-bank gate evidence [skip ci]' || true
          git push

      - name: Enforce all release gates
        if: always()
        env:
          BUILD: ${{ steps.build.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
          NATIVE: ${{ steps.native.outcome }}
          LEXICAL: ${{ steps.lexical.outcome }}
          CORPUS: ${{ steps.corpus.outcome }}
          EXPORT: ${{ steps.export.outcome }}
        run: |
          printf 'build=%s verify=%s native=%s lexical=%s corpus=%s export=%s\n' "$BUILD" "$VERIFY" "$NATIVE" "$LEXICAL" "$CORPUS" "$EXPORT"
          test "$BUILD" = success
          test "$VERIFY" = success
          test "$NATIVE" = success
          test "$LEXICAL" = success
          test "$CORPUS" = success
          test "$EXPORT" = success

      - name: Commit generated bank and fresh materials only after every gate passes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/dialogues.json data/config.json data/site_summary.json data/repetition_qa.json practice_pack materials/SOURCE_SCRIPTS.md materials/MODEL_ANSWERS.md build/release-samples.md || true
          git commit -m 'Finalize 500 native Cantonese CCL dialogues and study materials [skip ci]' || true
          git push

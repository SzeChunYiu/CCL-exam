name: Native Cantonese 500 Bank Integration

on:
  push:
    branches: [cantonese-script-audio-v4-integration]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-audit:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Python syntax
        run: |
          for f in scripts/build_native_500.py scripts/build_native_500_v2.py scripts/build_native_500_v3.py scripts/build_native_500_v4.py scripts/build_native_500_v5.py scripts/build_native_500_v6.py scripts/build_native_500_v7.py scripts/build_native_500_v8.py scripts/build_native_500_v9.py scripts/qa_cantonese.py scripts/verify_rewrite.py scripts/audit_native_cantonese_v2.py scripts/audit_cantonese_lexical_transfer.py scripts/generate_v4_audio.py scripts/upload_v4_segments.py; do python3 -m py_compile "$f"; done

      - name: Build all 500 dialogues from scenario blueprints
        run: python3 scripts/build_native_500_v9.py

      - name: Remove artificial Cantonese pitch cycling and stale 100-bank UI copy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/generate_v4_audio.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace('CCL_PITCH_CYCLE", "+0Hz,+6Hz,-5Hz,+3Hz,-8Hz"', 'CCL_PITCH_CYCLE", "+0Hz"')
          s=s.replace('# Slight per-dialogue pitch offset adds speaker individuality without changing\n# pace. Cycle is deliberately coprime with the voice-pool sizes so voice and\n# pitch do not lock into the same repeating pair.', '# Keep Cantonese lexical-tone contours untouched by default. Speaker variety\n# comes from the calibrated native zh-HK voice pool, not arbitrary pitch shifts.')
          p.write_text(s,encoding='utf-8')
          a=Path('app.js')
          a.write_text(a.read_text(encoding='utf-8').replace("'100-dialogue Library'", "'Question Library'"),encoding='utf-8')
          PY

      - name: Structural verification
        run: python3 scripts/verify_rewrite.py data/dialogues.json --no-baseline

      - name: Native template-distance gate
        run: python3 scripts/audit_native_cantonese_v2.py data/dialogues.json --json > /tmp/native-v2.json

      - name: Cantonese-only lexical-transfer gate
        run: python3 scripts/audit_cantonese_lexical_transfer.py data/dialogues.json --json > /tmp/lexical.json

      - name: Corpus-calibrated Cantonese hard gate
        run: python3 scripts/qa_cantonese.py data/dialogues.json

      - name: Inspect every metric even after a failed gate
        if: always()
        run: |
          python3 scripts/qa_cantonese.py data/dialogues.json --json > /tmp/cantonese-hard.json || true
          python3 scripts/audit_native_cantonese_v2.py data/dialogues.json --json > /tmp/native-v2.json || true
          python3 scripts/audit_cantonese_lexical_transfer.py data/dialogues.json --json > /tmp/lexical.json || true
          python3 - <<'PY'
          import json, pathlib, re
          from collections import Counter
          native=None
          for name in ['cantonese-hard','native-v2','lexical']:
            p=pathlib.Path('/tmp/'+name+'.json')
            if p.exists():
              try:
                x=json.loads(p.read_text())
                if name=='native-v2': native=x
                keys=['metrics','failures','dialogues','client_turns','client_sentences','exact_reuse_count','near_duplicate_count','skeleton_repeat_count','repair_turns','change_state_turns','short_turns_le10','long_turns_ge45','bare_endings','violating_segments','latin_tokens','unique_tokens','fingerprints','top_openers','top_endings']
                print(name, json.dumps({k:x.get(k) for k in keys if k in x},ensure_ascii=False,indent=2))
              except Exception as e: print(name,'parse error',e,p.read_text()[:4000])
          if native:
            print('TOP_NEAR_DUPLICATE_PAIRS')
            print(json.dumps(native.get('near_duplicates',[])[:40],ensure_ascii=False,indent=2))
            print('SKELETON_REPEATS')
            print(json.dumps(native.get('skeleton_repeats',[])[:20],ensure_ascii=False,indent=2))
          data=json.load(open('data/dialogues.json')); H=re.compile(r'[㐀-鿿]'); grams=Counter()
          for d in data:
            for s in d['segments']:
              if s.get('source_lang')!='yue': continue
              h=''.join(H.findall(s['source'])); grams.update(h[i:i+10] for i in range(max(0,len(h)-9)))
          print('TOP_REPEATED_10GRAMS')
          for g,n in grams.most_common(60):
            if n>1: print(n,g)
          PY

      - name: Commit generated bank after every gate passes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/dialogues.json data/site_summary.json data/config.json app.js scripts/generate_v4_audio.py
          if git diff --cached --quiet; then
            echo 'Generated bank already matches the committed bank.'
          else
            git commit -m 'Generate native Cantonese 500-dialogue bank [skip ci]'
            git push
          fi

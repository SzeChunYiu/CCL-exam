name: Native Cantonese 500 Bank Integration

on:
  push:
    branches: [cantonese-script-audio-v4-integration]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-audit:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Python syntax
        run: |
          python3 -m py_compile scripts/build_native_500.py
          python3 -m py_compile scripts/build_native_500_v2.py
          python3 -m py_compile scripts/build_native_500_v3.py
          python3 -m py_compile scripts/build_native_500_v4.py
          python3 -m py_compile scripts/qa_cantonese.py
          python3 -m py_compile scripts/verify_rewrite.py
          python3 -m py_compile scripts/audit_native_cantonese_v2.py
          python3 -m py_compile scripts/audit_cantonese_lexical_transfer.py
          python3 -m py_compile scripts/generate_v4_audio.py
          python3 -m py_compile scripts/upload_v4_segments.py

      - name: Build all 500 dialogues from scenario blueprints
        run: python3 scripts/build_native_500_v4.py

      - name: Remove artificial Cantonese pitch cycling and stale 100-bank UI copy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/generate_v4_audio.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace('CCL_PITCH_CYCLE", "+0Hz,+6Hz,-5Hz,+3Hz,-8Hz"', 'CCL_PITCH_CYCLE", "+0Hz"')
          s=s.replace('# Slight per-dialogue pitch offset adds speaker individuality without changing\n# pace. Cycle is deliberately coprime with the voice-pool sizes so voice and\n# pitch do not lock into the same repeating pair.', '# Keep Cantonese lexical-tone contours untouched by default. Speaker variety\n# comes from the calibrated native zh-HK voice pool, not arbitrary pitch shifts.')
          p.write_text(s,encoding='utf-8')
          a=Path('app.js')
          a.write_text(a.read_text(encoding='utf-8').replace("'100-dialogue Library'", "'Question Library'"),encoding='utf-8')
          PY

      - name: Structural verification
        run: python3 scripts/verify_rewrite.py data/dialogues.json --no-baseline

      - name: Corpus-calibrated Cantonese hard gate
        run: python3 scripts/qa_cantonese.py data/dialogues.json

      - name: Native template-distance gate
        run: python3 scripts/audit_native_cantonese_v2.py data/dialogues.json --json > /tmp/native-v2.json

      - name: Cantonese-only lexical-transfer gate
        run: python3 scripts/audit_cantonese_lexical_transfer.py data/dialogues.json --json > /tmp/lexical.json

      - name: Inspect full metrics and repetition hotspots
        if: always()
        run: |
          python3 scripts/qa_cantonese.py data/dialogues.json --json > /tmp/cantonese-hard.json || true
          python3 - <<'PY'
          import json, pathlib, re
          from collections import Counter
          x=json.load(open('/tmp/cantonese-hard.json'))
          print(json.dumps({'metrics':x.get('metrics'),'failures':x.get('failures')},ensure_ascii=False,indent=2))
          data=json.load(open('data/dialogues.json'))
          H=re.compile(r'[㐀-鿿]'); grams=Counter()
          for d in data:
            for s in d['segments']:
              if s.get('source_lang')!='yue': continue
              h=''.join(H.findall(s['source']))
              grams.update(h[i:i+10] for i in range(max(0,len(h)-9)))
          print('TOP_REPEATED_10GRAMS')
          for g,n in grams.most_common(80):
            if n>1: print(n,g)
          literary=['憂心','申報','狀況','確保','實體','予以','加以','方可','應當','事宜']
          print('LITERARY_HITS')
          for d in data:
            for s in d['segments']:
              hits=[w for w in literary if w in s['yue']]
              if hits: print(d['id'],s['n'],hits,s['yue'])
          for name in ['native-v2','lexical']:
            p=pathlib.Path('/tmp/'+name+'.json')
            if p.exists(): print(name,p.read_text())
          PY

      - name: Commit generated bank after every gate passes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/dialogues.json data/site_summary.json data/config.json app.js scripts/generate_v4_audio.py
          if git diff --cached --quiet; then
            echo 'Generated bank already matches the committed bank.'
          else
            git commit -m 'Generate native Cantonese 500-dialogue bank [skip ci]'
            git push
          fi

name: Native Cantonese 500 Bank Final Gate

on:
  push:
    branches: [cantonese-script-audio-v4-integration]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  final-bank-gate:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python syntax
        run: |
          python3 -m py_compile scripts/build_native_500_v10.py
          python3 -m py_compile scripts/build_native_500_v11.py
          python3 -m py_compile scripts/build_native_500_final2.py
          python3 -m py_compile scripts/build_native_500_final3.py
          python3 -m py_compile scripts/build_native_500_final4.py
          python3 -m py_compile scripts/build_native_500_final5.py
          python3 -m py_compile scripts/build_native_500_final6.py
          python3 -m py_compile scripts/export_final_materials.py
          python3 -m py_compile scripts/qa_cantonese.py
          python3 -m py_compile scripts/verify_final4_bank.py
          python3 -m py_compile scripts/audit_native_cantonese_v2.py
          python3 -m py_compile scripts/audit_cantonese_lexical_transfer.py
          python3 -m py_compile scripts/audit_whole_dialogue_naturalness.py

      - name: Build final6 500-dialogue candidate
        id: build
        run: |
          mkdir -p build/diagnostics
          set +e
          python3 scripts/build_native_500_final6.py > build/diagnostics/final6-build.log 2>&1
          code=$?
          set -e
          cat build/diagnostics/final6-build.log
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Final structural verification
        id: verify
        run: |
          set +e
          python3 scripts/verify_final4_bank.py data/dialogues.json --json > build/diagnostics/final6-verify.json 2>&1
          code=$?
          set -e
          cat build/diagnostics/final6-verify.json
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Cantonese client template-distance gate
        id: native
        run: |
          set +e
          python3 scripts/audit_native_cantonese_v2.py data/dialogues.json --json > build/diagnostics/final6-native.json 2>&1
          code=$?
          set -e
          cat build/diagnostics/final6-native.json
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Cantonese lexical-transfer gate
        id: lexical
        run: |
          set +e
          python3 scripts/audit_cantonese_lexical_transfer.py data/dialogues.json --json > build/diagnostics/final6-lexical.json 2>&1
          code=$?
          set -e
          cat build/diagnostics/final6-lexical.json
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Cantonese client corpus hard gate
        id: corpus
        run: |
          set +e
          python3 scripts/qa_cantonese.py data/dialogues.json --json > build/diagnostics/final6-corpus.json 2>&1
          code=$?
          set -e
          cat build/diagnostics/final6-corpus.json
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Whole-dialogue naturalness and anti-template gate
        id: whole
        run: |
          set +e
          python3 scripts/audit_whole_dialogue_naturalness.py data/dialogues.json --json > build/diagnostics/final6-whole.json 2>&1
          code=$?
          set -e
          cat build/diagnostics/final6-whole.json
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Export study materials from exact candidate JSON
        id: export
        run: |
          set +e
          python3 scripts/export_final_materials.py > build/diagnostics/final6-export.json 2>&1
          code=$?
          set -e
          cat build/diagnostics/final6-export.json
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Enforce every release gate
        id: enforce
        env:
          BUILD: ${{ steps.build.outputs.code }}
          VERIFY: ${{ steps.verify.outputs.code }}
          NATIVE: ${{ steps.native.outputs.code }}
          LEXICAL: ${{ steps.lexical.outputs.code }}
          CORPUS: ${{ steps.corpus.outputs.code }}
          WHOLE: ${{ steps.whole.outputs.code }}
          EXPORT: ${{ steps.export.outputs.code }}
        run: |
          printf 'build=%s verify=%s native=%s lexical=%s corpus=%s whole=%s export=%s\n' "$BUILD" "$VERIFY" "$NATIVE" "$LEXICAL" "$CORPUS" "$WHOLE" "$EXPORT"
          test "$BUILD" = 0
          test "$VERIFY" = 0
          test "$NATIVE" = 0
          test "$LEXICAL" = 0
          test "$CORPUS" = 0
          test "$WHOLE" = 0
          test "$EXPORT" = 0

      - name: Persist final6 diagnostics and gated bank
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build/diagnostics/final6-* || true
          if [ "${{ steps.enforce.outcome }}" = "success" ]; then
            git add data/dialogues.json data/config.json data/site_summary.json data/repetition_qa.json practice_pack materials/SOURCE_SCRIPTS.md materials/MODEL_ANSWERS.md build/release-samples.md || true
          fi
          git commit -m 'Record final6 gated release evidence [skip ci]' || exit 0
          git pull --rebase origin cantonese-script-audio-v4-integration
          git push origin HEAD:cantonese-script-audio-v4-integration
